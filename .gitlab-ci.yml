pages:
  stage: deploy
  variables:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
  script:
    - mkdir -p public
    - cp index.html public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

process-dictionary:
  stage: deploy
  image: python:3.12
  variables:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
  before_script:
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - pip install anthropic requests --quiet
  script:
    - python3 scripts/process_issues.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
