name: Process Dictionary Issues

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process
        required: true

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: ${{ github.event.label.name == 'dictionary' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Configure git
        run: |
          git config user.email "claude.ai.engine796@passmail.net"
          git config user.name "deepcharles"
      - name: Process issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/process_issues.py
